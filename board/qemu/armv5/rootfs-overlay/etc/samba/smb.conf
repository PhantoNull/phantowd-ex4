[global]
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    map to guest = Bad User
    guest account = nobody
    interfaces = lo
    bind interfaces only = yes
    smb ports = 445
    server min protocol = SMB3_00
    server max protocol = SMB3_11
    load printers = no
    printing = bsd
    printcap name = /dev/null

[phantowd-smb-smoke]
    path = /srv/phantowd-smb-smoke
    read only = yes
    browseable = yes
    guest ok = yes
