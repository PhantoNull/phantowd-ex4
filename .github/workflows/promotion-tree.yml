name: Promotion tree identity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Promotion tree identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare prospective or actual main with the qualified tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 support/verify-promotion-tree.py
