name: EX4 Stage B2 compile-only

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'tools/phantowd-lab/**'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - 'src/phantowd-api/**'
      - 'package/phantowd-api/**'
      - 'board/qemu/armv5/**'
      - 'configs/phantowd_qemu_armv5_defconfig'
      - 'support/container/test-api.sh'
      - 'support/qemu-smoke.sh'
      - 'support/test-api.ps1'
      - 'support/test-dashboard-ui.mjs'
      - 'support/dashboard-preview.mjs'
      - '.github/workflows/qemu-armv5.yml'
      - '.github/workflows/ex4-stage-b.yml'
      - '.github/workflows/ex4-stage-b2.yml'
      - '.github/workflows/ex4-stage-b3.yml'
      - '.github/workflows/host-tools.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'tools/phantowd-lab/**'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - 'src/phantowd-api/**'
      - 'package/phantowd-api/**'
      - 'board/qemu/armv5/**'
      - 'configs/phantowd_qemu_armv5_defconfig'
      - 'support/container/test-api.sh'
      - 'support/qemu-smoke.sh'
      - 'support/test-api.ps1'
      - 'support/test-dashboard-ui.mjs'
      - 'support/dashboard-preview.mjs'
      - '.github/workflows/qemu-armv5.yml'
      - '.github/workflows/ex4-stage-b.yml'
      - '.github/workflows/ex4-stage-b2.yml'
      - '.github/workflows/ex4-stage-b3.yml'
      - '.github/workflows/host-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ex4-stage-b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Linux versions across firmware profiles
        run: sh support/test-firmware-version-locks.sh

      - name: Build pinned environment
        run: docker build --file support/docker/Dockerfile --tag phantowd/buildroot:ci .

      - name: Create isolated build volume
        run: docker volume create phantowd-stage-b2-ci-${{ github.run_id }}

      - name: Compile and audit EX4 Stage B2 without building QEMU
        run: |
          test -x support/container/build-ex4-stage-b2.sh
          test -x board/wd/ex4/stage-b2/rootfs-overlay/init
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-stage-b2-ci-${{ github.run_id }},target=/workspace \
            phantowd/buildroot:ci \
            /bin/sh -c 'PHANTOWD_PREPARE_ONLY=1 /external/support/container/build-qemu.sh && /external/support/container/build-ex4-stage-b2.sh'

      - name: Upload compile-only EX4 Stage B2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-ex4-stage-b2-compile-only
          path: artifacts/ex4-stage-b2-compile-only/
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated build volume
        if: always()
        run: docker volume rm phantowd-stage-b2-ci-${{ github.run_id }} || true
