name: EX4 Stage B3 compile-only

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'board/wd/ex4/stage-a/**'
      - 'board/wd/ex4/stage-b/**'
      - 'board/wd/ex4/stage-b2/**'
      - 'board/wd/ex4/stage-b3/**'
      - 'board/wd/ex4/patches/linux/**'
      - 'configs/phantowd_ex4_stage_a_defconfig'
      - 'configs/phantowd_ex4_stage_b_defconfig'
      - 'configs/phantowd_ex4_stage_b2_defconfig'
      - 'configs/phantowd_ex4_stage_b3_defconfig'
      - 'Config.in'
      - 'external.desc'
      - 'external.mk'
      - 'support/build-ex4-stage-b3.ps1'
      - 'support/container/build-ex4-stage-b2.sh'
      - 'support/container/build-ex4-stage-b3.sh'
      - 'support/container/build-qemu.sh'
      - 'support/docker/Dockerfile'
      - 'support/tests/test-stage-b3-mac-policy.sh'
      - 'versions.env'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'board/wd/ex4/stage-a/**'
      - 'board/wd/ex4/stage-b/**'
      - 'board/wd/ex4/stage-b2/**'
      - 'board/wd/ex4/stage-b3/**'
      - 'board/wd/ex4/patches/linux/**'
      - 'configs/phantowd_ex4_stage_a_defconfig'
      - 'configs/phantowd_ex4_stage_b_defconfig'
      - 'configs/phantowd_ex4_stage_b2_defconfig'
      - 'configs/phantowd_ex4_stage_b3_defconfig'
      - 'Config.in'
      - 'external.desc'
      - 'external.mk'
      - 'support/build-ex4-stage-b3.ps1'
      - 'support/container/build-ex4-stage-b2.sh'
      - 'support/container/build-ex4-stage-b3.sh'
      - 'support/container/build-qemu.sh'
      - 'support/docker/Dockerfile'
      - 'support/tests/test-stage-b3-mac-policy.sh'
      - 'versions.env'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ex4-stage-b3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned environment
        run: docker build --file support/docker/Dockerfile --tag phantowd/buildroot:ci .

      - name: Create isolated build volume
        run: docker volume create phantowd-stage-b3-ci-${{ github.run_id }}

      - name: Compile and audit EX4 Stage B3 without building QEMU
        run: |
          test -x support/container/build-ex4-stage-b3.sh
          test -x board/wd/ex4/stage-b3/rootfs-overlay/init
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-stage-b3-ci-${{ github.run_id }},target=/workspace \
            phantowd/buildroot:ci \
            /bin/sh -c 'PHANTOWD_PREPARE_ONLY=1 /external/support/container/build-qemu.sh && /external/support/container/build-ex4-stage-b3.sh'

      - name: Upload compile-only EX4 Stage B3 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-ex4-stage-b3-compile-only
          path: artifacts/ex4-stage-b3-compile-only/
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated build volume
        if: always()
        run: docker volume rm phantowd-stage-b3-ci-${{ github.run_id }} || true
