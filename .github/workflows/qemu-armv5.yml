name: QEMU ARMv5 baseline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'tools/phantowd-lab/**'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - '.github/workflows/host-tools.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'tools/phantowd-lab/**'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - '.github/workflows/host-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-armv5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-and-dtb:
    name: Build QEMU baseline and EX4 research DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Linux versions across firmware profiles
        run: sh support/test-firmware-version-locks.sh

      - name: Exercise dashboard interaction states
        run: node support/test-dashboard-ui.mjs

      - name: Build pinned environment
        run: docker build --file support/docker/Dockerfile --tag phantowd/buildroot:ci .

      - name: Create isolated QEMU build volume
        run: docker volume create phantowd-ci-${{ github.run_id }}-qemu

      - name: Build and boot ARMv5 image
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-qemu,target=/workspace \
            phantowd/buildroot:ci \
            /external/support/container/build-qemu.sh

      - name: Compile EX4 device-tree research baseline
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-qemu,target=/workspace \
            phantowd/buildroot:ci \
            /external/support/container/build-ex4-dtb.sh

      - name: Upload non-flashable QEMU artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-qemu-armv5
          path: artifacts/qemu-armv5/
          if-no-files-found: error
          retention-days: 7

      - name: Upload non-flashable EX4 DTB research artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-ex4-dtb-research
          path: artifacts/ex4-dtb-research/
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated QEMU build volume
        if: always()
        run: docker volume rm phantowd-ci-${{ github.run_id }}-qemu || true

  compile-stage-a:
    name: Compile-only EX4 Stage A
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Linux versions across firmware profiles
        run: sh support/test-firmware-version-locks.sh

      - name: Build pinned environment
        run: docker build --file support/docker/Dockerfile --tag phantowd/buildroot:ci .

      - name: Create isolated Stage A build volume
        run: docker volume create phantowd-ci-${{ github.run_id }}-stage-a

      - name: Prepare and verify pinned Buildroot/Linux sources
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-stage-a,target=/workspace \
            --env PHANTOWD_PREPARE_ONLY=1 \
            phantowd/buildroot:ci \
            /external/support/container/build-qemu.sh

      - name: Compile and verify EX4 Stage A image
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-stage-a,target=/workspace \
            phantowd/buildroot:ci \
            /external/support/container/build-ex4-stage-a.sh

      - name: Upload compile-only EX4 Stage A artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-ex4-stage-a-compile-only
          path: artifacts/ex4-stage-a-compile-only/
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated build volume
        if: always()
        run: docker volume rm phantowd-ci-${{ github.run_id }}-stage-a || true
