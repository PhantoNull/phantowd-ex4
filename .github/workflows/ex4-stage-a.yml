name: EX4 Stage A compile-only (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ex4-stage-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-stage-a:
    name: Compile-only EX4 Stage A
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned Linux versions across firmware profiles
        run: sh support/test-firmware-version-locks.sh

      - name: Build pinned environment
        run: docker build --file support/docker/Dockerfile --tag phantowd/buildroot:ci .

      - name: Create isolated Stage A build volume
        run: docker volume create phantowd-ci-${{ github.run_id }}-stage-a

      - name: Prepare and verify pinned Buildroot/Linux sources
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-stage-a,target=/workspace \
            --env PHANTOWD_PREPARE_ONLY=1 \
            phantowd/buildroot:ci \
            /external/support/container/build-qemu.sh

      - name: Compile and verify EX4 Stage A image
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD",target=/external \
            --mount type=volume,source=phantowd-ci-${{ github.run_id }}-stage-a,target=/workspace \
            phantowd/buildroot:ci \
            /external/support/container/build-ex4-stage-a.sh

      - name: Upload compile-only EX4 Stage A artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantowd-ex4-stage-a-compile-only
          path: artifacts/ex4-stage-a-compile-only/
          if-no-files-found: error
          retention-days: 7

      - name: Remove isolated build volume
        if: always()
        run: docker volume rm phantowd-ci-${{ github.run_id }}-stage-a || true
