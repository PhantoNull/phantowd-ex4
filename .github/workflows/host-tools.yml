      - 'support/tests/test-samba-root-fixture.py'
      - 'support/tests/test-qemu-samba-root.sh'
      - 'support/tests/runtime_loader_fixture.py'
      - 'support/tests/test-runtime-loader-fixture.py'
      - 'support/tests/test-qemu-runtime-loader.sh'
      - 'support/build-qemu.ps1'
      - 'support/tests/test-cached-qemu-wrapper.ps1'
      - 'support/tests/test-cached-qemu-preflight.py'
      - 'support/clean-qemu-build-volumes.ps1'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - 'support/tests/test-qemu-build-feedback.py'
      - 'support/tests/test-qemu-kernel-inputs.py'
      - 'support/container/qemu_kernel_inputs.py'
      - 'support/container/save-qemu-failure-log.sh'
      - 'support/tests/test-storage-broker-buildroot.sh'
      - 'support/container/audit-ex4-stage-b-kernel-config.sh'
      - 'support/tests/test-ex4-stage-b-kernel-config-audit.sh'
      - '.github/workflows/qemu-armv5.yml'
      - '.github/workflows/ex4-stage-a.yml'
      - '.github/workflows/ex4-stage-b.yml'
      - '.github/workflows/ex4-stage-b2.yml'
      - '.github/workflows/ex4-stage-b3.yml'
      - '.github/workflows/host-tools.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'support/tests/test-smart-replay.sh'
      - 'support/tests/test-smart-replay-boundaries.py'
      - 'support/test-smart-report.ps1'
      - 'support/tests/test-smart-report-wrapper.ps1'
      - 'support/tests/test-qemu-smart-report.sh'
      - 'support/tests/smart-report-init.sh'
      - 'support/tests/test-smart-replay-contract.py'
      - 'tools/phantowd-lab/**'
      - 'src/phantowd-service-launcher/**'
      - 'support/test-service-launcher.ps1'
      - 'support/tests/test-service-launcher.py'
      - 'support/tests/test-qemu-service-launcher.sh'
      - 'support/tests/service-launcher-fixture.c'
      - 'support/tests/service-launcher-init.sh'
      - 'support/test-runtime-loader.ps1'
      - 'support/test-atomic-dispatch.ps1'
      - 'support/tests/atomic-*'
      - 'support/tests/atomic_dispatch_fixture.py'
      - 'support/tests/test-atomic-dispatch-fixture.py'
      - 'support/tests/test-qemu-atomic-dispatch.sh'
      - 'support/test-runtime-owner.ps1'
      - 'support/tests/runtime-owner-init.sh'
      - 'support/tests/test-qemu-runtime-owner.sh'
      - 'support/test-samba-root.ps1'
      - 'support/tests/samba-root-*'
      - 'support/tests/samba-charset-fixture.c'
      - 'support/tests/samba_root_fixture.py'
      - 'support/tests/test-samba-root-fixture.py'
      - 'support/tests/test-qemu-samba-root.sh'
      - 'support/tests/runtime_loader_fixture.py'
      - 'support/tests/test-runtime-loader-fixture.py'
      - 'support/tests/test-qemu-runtime-loader.sh'
      - 'support/build-qemu.ps1'
      - 'support/tests/test-cached-qemu-wrapper.ps1'
      - 'support/tests/test-cached-qemu-preflight.py'
      - 'support/clean-qemu-build-volumes.ps1'
      - 'support/test-lab-tools.ps1'
      - 'support/container/test-lab-tools.sh'
      - 'support/test-firmware-workflow-paths.sh'
      - 'support/tests/test-qemu-build-feedback.py'
      - 'support/tests/test-qemu-kernel-inputs.py'
      - 'support/container/qemu_kernel_inputs.py'
      - 'support/container/save-qemu-failure-log.sh'
      - 'support/tests/test-storage-broker-buildroot.sh'
      - 'support/container/audit-ex4-stage-b-kernel-config.sh'
      - 'support/tests/test-ex4-stage-b-kernel-config-audit.sh'
      - '.github/workflows/qemu-armv5.yml'
      - '.github/workflows/ex4-stage-a.yml'
      - '.github/workflows/ex4-stage-b.yml'
      - '.github/workflows/ex4-stage-b2.yml'
      - '.github/workflows/ex4-stage-b3.yml'
      - '.github/workflows/host-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from module pin
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/phantowd-lab/go.mod
          cache-dependency-path: tools/phantowd-lab/go.mod

      - name: Verify host-tool packages
        working-directory: tools/phantowd-lab
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=vendor
        run: |
          go version
          go vet ./...
          go test -race -count=1 ./...
          go test -run '^$' -fuzz '^FuzzInspect$' -fuzztime=10000x -parallel=2 -timeout=120s ./vendorupdate
          go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=10000x -parallel=2 -timeout=120s ./mcuproto
          go test -run '^$' -fuzz '^FuzzDecodeReceiveDiagnosticBounds$' -fuzztime=10000x -parallel=2 -timeout=120s ./mcuproto
          go test -run '^$' -fuzz '^FuzzARMAttributesNeverExposePartialObservation$' -fuzztime=10000x -parallel=2 -timeout=120s ./rootfsinventory

      - name: Verify firmware workflow path contracts
        run: sh support/test-firmware-workflow-paths.sh

      - name: Verify QEMU build feedback contracts
        run: python3 -B support/tests/test-qemu-build-feedback.py

      - name: Verify cached-only local wrapper command boundary
        shell: pwsh
        run: ./support/tests/test-cached-qemu-wrapper.ps1

      - name: Verify cached-only preflight on disposable Linux fixtures
        run: python3 -B support/tests/test-cached-qemu-preflight.py

      - name: Verify SMART wrapper default and bounded command boundary
        shell: pwsh
        run: ./support/tests/test-smart-report-wrapper.ps1

      - name: Verify SMART runner markers and disposable cleanup
        run: python3 -B support/tests/test-smart-replay-contract.py

      - name: Verify native service launcher refusals
        run: python3 -B support/tests/test-service-launcher.py

      - name: Verify runtime-loader comparison refusals
        run: python3 -B support/tests/test-runtime-loader-fixture.py

      - name: Verify atomic-dispatch evidence refusals
        run: python3 -B support/tests/test-atomic-dispatch-fixture.py

      - name: Verify Samba-root experiment refusals
        run: python3 -B support/tests/test-samba-root-fixture.py

      - name: Verify kernel-input invalidation and ACL requirements
        run: python3 -B support/tests/test-qemu-kernel-inputs.py

      - name: Test Stage B kernel-config audit policy
        run: sh support/tests/test-ex4-stage-b-kernel-config-audit.sh
