permissions:
  contents: read

concurrency:
  group: host-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify firmware workflow path contracts
        run: sh support/test-firmware-workflow-paths.sh

      - name: Verify QEMU build feedback contracts
        run: |
          set -eu
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          test "$runner_temp" != /
          fixture="$(mktemp -d "$runner_temp/phantowd-native-feedback.XXXXXX")"
          test "$(dirname "$(realpath -e "$fixture")")" = "$runner_temp"
          cleanup() {
            status=$?
            trap - EXIT
            if mountpoint -q -- "$fixture"; then
              sudo umount "$fixture" || exit 1
            fi
            rmdir -- "$fixture" || exit 1
            exit "$status"
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o "size=256m,exec,nosuid,nodev,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$fixture"
          export TMPDIR="$fixture"
          python3 -B support/tests/test-qemu-build-feedback.py
          python3 -B support/tests/test-build-jobs.py

      - name: Verify cached-only local wrapper command boundary
        shell: pwsh
        run: ./support/tests/test-cached-qemu-wrapper.ps1

      - name: Verify experimental cached host lifecycle with fake local children
        run: node support/tests/test-cached-qemu-runner.mjs

      - name: Verify cached-only preflight on disposable Linux fixtures
        run: python3 -B support/tests/test-cached-qemu-preflight.py

      - name: Verify bounded local Linux API wrapper command boundary
        shell: pwsh
        run: |
          ./support/tests/test-api-linux-wrapper.ps1
          ./support/tests/test-api-overlay-wrapper.ps1
          ./support/tests/test-api-overlay-stderr.ps1

      - name: Verify SMART wrapper default and bounded command boundary
        shell: pwsh
        run: ./support/tests/test-smart-report-wrapper.ps1

      - name: Verify SMART runner markers and disposable cleanup
        run: python3 -B support/tests/test-smart-replay-contract.py

      - name: Verify invented ATA identity input and projection controls
        run: python3 -B support/tests/test-smart-replay-identify.py

      - name: Verify SMART producer runner and guest init syntax
        run: |
          for script in support/tests/test-qemu-smart-replay.sh support/tests/smart-replay-arm-init.sh; do
            sh -n "$script"
          done

      - name: Verify native service launcher refusals
        run: python3 -B support/tests/test-service-launcher.py

      - name: Verify runtime-loader comparison refusals
        run: python3 -B support/tests/test-runtime-loader-fixture.py

      - name: Verify atomic-dispatch evidence refusals
        run: python3 -B support/tests/test-atomic-dispatch-fixture.py

      - name: Verify Samba-root experiment refusals
        run: python3 -B support/tests/test-samba-root-fixture.py

      - name: Verify Samba wrapper defaults and bounded command boundary
        shell: pwsh
        run: ./support/tests/test-samba-root-wrapper.ps1

      - name: Verify kernel-input invalidation and ACL requirements
        run: python3 -B support/tests/test-qemu-kernel-inputs.py

      - name: Verify isolated LIO contracts without kernel compilation or guest boot
        run: |
          python3 -B support/tests/test-qemu-lio-inputs.py
          python3 -B support/tests/test-qemu-lio-result.py
          sh support/tests/test-lio-lun-set.sh "$PWD"
          for script in support/container/build-qemu-lio-kernel.sh support/container/build-qemu-iscsi-client.sh support/qemu-lio-fixture.sh support/fixtures/qemu-lio-init.sh support/tests/test-qemu-lio-snapshot-temp.sh; do
            sh -n "$script"
          done

      - name: Verify LIO local wrapper command boundary without Docker
        shell: pwsh
        run: ./support/tests/test-qemu-lio-wrapper.ps1

      - name: Test Stage B kernel-config audit policy
        run: sh support/tests/test-ex4-stage-b-kernel-config-audit.sh

      - name: Select pinned host Go SDK
        id: host_go
        shell: bash
        run: |
          set -eu
          version="$(awk -v BINMODE=3 -F= '
            $1 == "GO_VERSION" { count++; value = substr($0, index($0, "=") + 1) }
            END {
              if (count != 1 || value !~ /^[0-9]+\.[0-9]+\.[0-9]+$/) {
                print "Invalid or ambiguous GO_VERSION lock" > "/dev/stderr"
                exit 1
              }
              print value
            }
          ' versions.env)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go from locked SDK
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.host_go.outputs.version }}
          cache-dependency-path: tools/phantowd-lab/go.mod

      - name: Verify host-tool packages
        working-directory: tools/phantowd-lab
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=vendor
        run: |
          go version
          test "$(go env GOVERSION)" = "go${{ steps.host_go.outputs.version }}"
          go vet ./...
          go test -race -count=1 ./...
          go test -run '^$' -fuzz '^FuzzInspect$' -fuzztime=10000x -parallel=2 -timeout=120s ./vendorupdate
          go test -run '^$' -fuzz '^FuzzStreamDecoder$' -fuzztime=10000x -parallel=2 -timeout=120s ./mcuproto
          go test -run '^$' -fuzz '^FuzzDecodeReceiveDiagnosticBounds$' -fuzztime=10000x -parallel=2 -timeout=120s ./mcuproto
          go test -run '^$' -fuzz '^FuzzARMAttributesNeverExposePartialObservation$' -fuzztime=10000x -parallel=2 -timeout=120s ./rootfsinventory

      - name: Verify complete native API and race contracts before firmware qualification
        working-directory: src/phantowd-api
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=vendor
          GOMAXPROCS: '2'
        run: |
          go version
          test "$(id -u)" -ne 0
          go test -count=1 -v -run '^TestAPIStartupRejectsOptionsBeforeStateOpen$' .
          go vet ./...
          go test -count=1 ./...
          go vet -tags=qemu ./...
          go test -tags=qemu -run '^TestQEMUStateProcReaderObservesAndRedactsOwnerCWD$' -count=1 .
          go test -race -count=1 ./...

      - name: Verify synthetic dashboard preview boundaries
        run: |
          node --check support/test-dashboard-browser.mjs
          node --check support/browser-service-policy-flow.mjs
          sh support/tests/test-nas-policy-edit-receipt.sh
          node support/tests/test-dashboard-preview.mjs
          node support/test-dashboard-ui.mjs

      - name: Verify host-only browser API fixture boundaries
        working-directory: src/phantowd-api
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
          GOFLAGS: -mod=vendor
        run: go test -count=1 -run '^Test(BrowserFixtureDiagnosticsStaySynthetic|BrowserPolicyFixtureActualHTTPRoundTrip|DashboardBrowserAPIFixture)$' .
