      - 'support/tests/test-smart-report-wrapper.ps1'
      - 'support/tests/test-qemu-smart-report.sh'
      - 'support/tests/smart-report-init.sh'
      - 'support/tests/test-smart-replay-contract.py'
      - 'tools/phantowd-lab/**'
